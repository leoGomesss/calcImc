<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="Estilos/estilo.css">
    <link rel="shortcut icon" href="Imagens/imagemCalc.png" type="image/x-icon">
    <script src="Scripts/index.js" defer></script>
</head>
<body>
    <div class="container"> 
        <div class="container-calc">
            <h2>Calculadora de IMC</h2>
            <label for="altura">Altura</label>
<input type="number" id="ialtura" name="altura" maxlength="3" placeholder="Ex: 1.77" required>
            <label for="peso">Peso</label>
<input type="number" id="ipeso" name="peso" maxlength="3" placeholder="Ex: 70" required>
            <div class="container-botao">
                <button>Calcular</button>
                <button id="limpar">Limpar</button>
            </div>
        </div>
    </div>
    
</body>
</html>
