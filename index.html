<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="Estilos/estilo.css">
    <link rel="shortcut icon" href="Imagens/imagemCalc.png" type="image/x-icon">
    <script src="Scripts/index.js" defer></script>
</head>
<body>
    <div class="container"> 
        <div id="containerCalc">
            <h2 id="container-texto">Calculadora IMC</h2>
            <label for="ialtura">Altura</label>
<input type="number" id="ialtura" name="altura" placeholder="Ex: 165" required>
            <label for="ipeso">Peso</label>
<input type="number" id="ipeso" name="peso" placeholder="Ex: 62.5" required>
            <div class="container-botao">
                <button id="calcular">Calcular</button>
                <button id="limpar">Limpar</button>
            </div>
        </div> 
        <div id="containerImc">
            <div id="containerImc-conteudo">
                <h2>CLASSIFICAÇÃO - IMC</h2>
                <p id="resultado"></p> 
                <button id="btnVoltar">Voltar</button>
            </div>
        </div>
    </div>
</body>
</html>
